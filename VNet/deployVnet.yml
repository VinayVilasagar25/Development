parameters:
- name: serviceconn
  type: string
- name: internalstageenvparameter
  type: string
  default: ''

steps:
- task: replacetokens@3
  displayName: 'Replace Token Variables in Vnet ARM Template'
  inputs:
    rootDirectory: 'build/armTemplates/VirtualNetwork'
    targetFiles: '**/*.json;**/*.targets;**/*.deployproj;**/*.ps1'
    encoding: 'auto'
    writeBOM: true
    actionOnMissing: 'warn'
    keepToken: true
    tokenPrefix: '#{'
    tokenSuffix: '}#'
    useLegacyPattern: false
    enableTelemetry: true
    
- task: AzureCLI@2
  displayName: 'Check if VNet, NSG, and NAT Gateway exist'
  inputs:
    azureSubscription: '${{ parameters.serviceconn }}'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      $ErrorActionPreference = "Continue"
      $vnetExists = $false
      $nsgExists = $false
      $natExists = $false
      try {
        $vnet = az network vnet show --resource-group $(resGroup) --name $(resGroupVnet) --query "name" --output tsv
        if ($vnet) { $vnetExists = $true }
      } catch {}
      try {
        $nsg = az network nsg show --resource-group $(resGroup) --name $(resGroupNsg) --query "name" --output tsv
        if ($nsg) { $nsgExists = $true }
      } catch {}
      try {
        $nat = az network nat gateway show --resource-group $(resGroup) --name $(resGroupNat) --query "name" --output tsv
        if ($nat) { $natExists = $true }
      } catch {}
      if ($vnetExists -and $nsgExists -and $natExists) {
        Write-Host "##vso[task.setvariable variable=skipDeployment]true"
      } else {
        Write-Host "##vso[task.setvariable variable=skipDeployment]false"
      }
  enabled: true

- task: AzureResourceGroupDeployment@2
  displayName: 'Deploy Shared Virtual Network ARM Template'
  condition: ne(variables['skipDeployment'], 'true')
  inputs:
    azureSubscription: '${{ parameters.serviceconn }}'
    resourceGroupName: '$(resGroup)'
    location: '$(Resource.Location)'
    templateLocation: 'Linked artifact'
    csmFile: 'build/armTemplates/VirtualNetwork/vnet.json'
    overrideParameters: '-customerID $(IMHmeshID) -virtualNetworkName $(resGroupVnet) -SharedSubnetName "default" -location $(Resource.Location) -networkSecurityGroupName $(resGroupNsg) -NATGatewayname $(resGroupNat)'
  enabled: true

- task: AzurePowerShell@5
  displayName: 'Ensure Subnet Delegation for Web Service and Enable Network Policy for Private Endpoints'
  inputs:
    azureSubscription: '${{ parameters.serviceconn }}'
    ScriptType: 'InlineScript'
    Inline: |
      $resourceGroup = "$(resGroup)"
      $vnetName = "$(resGroupVnet)"
      $subnetName = "default"
      $delegationName = "MicrosoftWebServerFarmsDelegation"
      $delegationServiceName = "Microsoft.Web/serverFarms"

      $vnet = Get-AzVirtualNetwork -Name $vnetName -ResourceGroupName $resourceGroup
      $subnet = $vnet.Subnets | Where-Object { $_.Name -eq $subnetName }
      if (-not $subnet) {
        Write-Error "Subnet '$subnetName' not found in VNet '$vnetName'"
        exit 1
      }

      $delegation = $subnet.Delegations | Where-Object { $_.ServiceName -eq $delegationServiceName }
      if (-not $delegation) {
        Write-Host "Adding delegation '$delegationServiceName' to subnet '$subnetName'"
        $subnetConfig = Set-AzVirtualNetworkSubnetConfig `
          -VirtualNetwork $vnet `
          -Name $subnetName `
          -AddressPrefix $subnet.AddressPrefix `
          -Delegation (New-AzDelegation -Name $delegationName -ServiceName $delegationServiceName) `
          -PrivateEndpointNetworkPolicies Enabled
        Set-AzVirtualNetwork -VirtualNetwork $vnet
      } else {
        Write-Host "Delegation '$delegationServiceName' already exists on subnet '$subnetName'"
        # Ensure PrivateEndpointNetworkPolicies is enabled even if delegation exists
        $subnetConfig = Set-AzVirtualNetworkSubnetConfig `
          -VirtualNetwork $vnet `
          -Name $subnetName `
          -AddressPrefix $subnet.AddressPrefix `
          -Delegation $delegation `
          -PrivateEndpointNetworkPolicies Enabled
        Set-AzVirtualNetwork -VirtualNetwork $vnet
      }
      Write-Host "Subnet delegation and network policy for private endpoints ensured."
    azurePowerShellVersion: 'LatestVersion'
  enabled: true

- task: AzureCLI@2
  displayName: "Configure Networking for Function Apps and Web Apps in RGs"
  inputs:
    azureSubscription: '${{ parameters.serviceconn }}'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      $ErrorActionPreference = "Continue"

      # Target resource groups
      $resourceGroups = @("$(resGroupSvc)", "$(resGroupPaymentSvc)", "$(resGroupIMHConfigMgmt)")
      
      # Shared resources
      $resourceGroup = "$(resGroup)"        # where vnet + nsg live
      $vnetName      = "$(resGroupVnet)"
      $subnetName    = "default"
      $nsgName       = "$(resGroupNsg)"
      $natGatewayName = "$(natGatewayName)" # NAT Gateway name (add this parameter)

      # Validate shared resources
      $subscriptionId = az account show --query id -o tsv
      $vnetExists = az network vnet show --name $vnetName --resource-group $resourceGroup --query "name" -o tsv 2>$null
      if (-not $vnetExists) { Write-Error "VNet not found"; exit 1 }
      $nsgExists = az network nsg show --name $nsgName --resource-group $resourceGroup --query "name" -o tsv 2>$null
      if (-not $nsgExists) { Write-Error "NSG not found"; exit 1 }

      $vnetResourceId   = "/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Network/virtualNetworks/$vnetName"
      $subnetResourceId = "$vnetResourceId/subnets/$subnetName"
      $nsgResourceId    = "/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Network/networkSecurityGroups/$nsgName"
      $natGatewayResourceId = "/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Network/natGateways/$natGatewayName"

      # Check NAT Gateway existence
      $natGatewayExists = $false
      if (![string]::IsNullOrWhiteSpace($natGatewayName)) {
        $natGatewayCheck = az network nat gateway show --name $natGatewayName --resource-group $resourceGroup --query "name" -o tsv 2>$null
        $natGatewayExists = ![string]::IsNullOrWhiteSpace($natGatewayCheck)
      }

      Write-Host "=== Configuring Subnet for App Service Integration ==="
      
      # Get current subnet configuration
      $currentSubnet = az network vnet subnet show --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName -o json | ConvertFrom-Json

      # Check and add Microsoft.Web/serverFarms delegation for App Service VNet integration
      $hasWebDelegation = $false
      if ($currentSubnet.delegations) {
        $hasWebDelegation = $currentSubnet.delegations | Where-Object { $_.serviceName -eq "Microsoft.Web/serverFarms" }
      }

      if (-not $hasWebDelegation) {
        Write-Host "Adding Microsoft.Web/serverFarms delegation to subnet $subnetName"
        az network vnet subnet update --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName --delegations "Microsoft.Web/serverFarms"
        Start-Sleep -Seconds 5
      } else {
        Write-Host "Subnet $subnetName already has Microsoft.Web/serverFarms delegation"
      }

      # Ensure NSG is associated with subnet
      $currentSubnetNsg = az network vnet subnet show --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName --query "networkSecurityGroup.id" -o tsv 2>$null
      if (-not ($currentSubnetNsg -and $currentSubnetNsg.Contains($nsgName))) {
        Write-Host "Associating NSG $nsgName with subnet $subnetName"
        az network vnet subnet update --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName --network-security-group $nsgResourceId
        Start-Sleep -Seconds 5
      } else {
        Write-Host "NSG $nsgName already associated with subnet $subnetName"
      }

      # Associate NAT Gateway with subnet if it exists
      if ($natGatewayExists) {
        $currentSubnetNat = az network vnet subnet show --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName --query "natGateway.id" -o tsv 2>$null
        if (-not ($currentSubnetNat -and $currentSubnetNat.Contains($natGatewayName))) {
          Write-Host "Associating NAT Gateway $natGatewayName with subnet $subnetName"
          az network vnet subnet update --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName --nat-gateway $natGatewayResourceId
          Start-Sleep -Seconds 5
        } else {
          Write-Host "NAT Gateway $natGatewayName already associated with subnet $subnetName"
        }
      } else {
        Write-Host "NAT Gateway not found or not specified - using default Azure outbound connectivity"
      }

      foreach ($rg in $resourceGroups) {
        if ([string]::IsNullOrWhiteSpace($rg)) { continue }
        Write-Host "----- Processing Resource Group: $rg -----"

        # Collect Function Apps + Web Apps with more details
        $apps = @()
        $webApps = az webapp list --resource-group $rg --query "[].{Name:name,Type:'WebApp',Kind:kind,AppServicePlanId:appServicePlanId}" -o json | ConvertFrom-Json
        $functionApps = az functionapp list --resource-group $rg --query "[].{Name:name,Type:'FunctionApp',Kind:kind,AppServicePlanId:appServicePlanId}" -o json | ConvertFrom-Json
        
        if ($webApps) { $apps += $webApps }
        if ($functionApps) { $apps += $functionApps }

        foreach ($app in $apps) {
          $appName = $app.Name
          $appType = $app.Type
          $appKind = $app.Kind
          
          Write-Host "=== Configuring $appType : $appName (Kind: $appKind) ==="

          # Get app service plan details to determine if it supports VNet integration
          $appServicePlanId = $app.AppServicePlanId
          if ($appServicePlanId) {
            $planDetails = az appservice plan show --ids $appServicePlanId --query "{sku:sku.name,tier:sku.tier}" -o json | ConvertFrom-Json
            Write-Host "App Service Plan: $($planDetails.tier) $($planDetails.sku)"
          }

          # Enforce HTTPS - Use correct command based on app type
          Write-Host "Enforcing HTTPS for $appName"
          if ($appType -eq "FunctionApp") {
            az functionapp update --name $appName --resource-group $rg --set httpsOnly=true --output none
          } else {
            az webapp update --name $appName --resource-group $rg --set httpsOnly=true --output none
          }

          # Configure outbound traffic settings BEFORE VNet integration
          Write-Host "Configuring outbound traffic settings for $appName"
          
          # Force all outbound traffic through VNet (critical for both Web Apps and Function Apps)
          if ($appType -eq "FunctionApp") {
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_VNET_ROUTE_ALL=1 --output none
          } else {
            az webapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_VNET_ROUTE_ALL=1 --output none
          }

          # Function App specific outbound configuration
          if ($appType -eq "FunctionApp") {
            Write-Host "Applying Function App specific outbound settings for $appName"
            
            # Enable content over VNet for Function Apps (Premium plans)
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_CONTENTOVERVNET=1 --output none
            
            # Disable public access to storage account (Premium plans)
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_CONTENTSHARE_FORCE_VNET=1 --output none
            
            # Set DNS configuration for Function Apps
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_DNS_SERVER=168.63.129.16 --output none
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_DNS_ALT_SERVER=1.1.1.1 --output none
          }

          # Remove existing VNet integration to ensure clean state - Use correct command
          if ($appType -eq "FunctionApp") {
            $existingVnetIntegration = az functionapp vnet-integration list --name $appName --resource-group $rg --query "[0].id" -o tsv 2>$null
            if ($existingVnetIntegration) {
              Write-Host "Removing existing VNet integration for Function App $appName"
              az functionapp vnet-integration remove --name $appName --resource-group $rg --output none
              Start-Sleep -Seconds 15
            }
          } else {
            $existingVnetIntegration = az webapp vnet-integration list --name $appName --resource-group $rg --query "[0].id" -o tsv 2>$null
            if ($existingVnetIntegration) {
              Write-Host "Removing existing VNet integration for Web App $appName"
              az webapp vnet-integration remove --name $appName --resource-group $rg --output none
              Start-Sleep -Seconds 15
            }
          }

          # Add VNet integration with enhanced error handling - Use correct command
          Write-Host "Adding VNet integration for $appName to subnet $subnetName"
          
          $vnetIntegrationSuccess = $false
          
          if ($appType -eq "FunctionApp") {
            # Function App VNet integration
            try {
              az functionapp vnet-integration add --name $appName --resource-group $rg --vnet $vnetResourceId --subnet $subnetName --output none 2>$null
              if ($LASTEXITCODE -eq 0) {
                $vnetIntegrationSuccess = $true
                Write-Host "Function App VNet integration successful using resource ID"
              }
            } catch {
              Write-Host "Function App VNet integration with resource ID failed, trying with VNet name"
            }

            # Fallback for Function App
            if (-not $vnetIntegrationSuccess) {
              try {
                az functionapp vnet-integration add --name $appName --resource-group $rg --vnet $vnetName --subnet $subnetName --output none
                if ($LASTEXITCODE -eq 0) {
                  $vnetIntegrationSuccess = $true
                  Write-Host "Function App VNet integration successful using VNet name"
                }
              } catch {
                Write-Error "Function App VNet integration failed for $appName with both methods"
              }
            }
          } else {
            # Web App VNet integration
            try {
              az webapp vnet-integration add --name $appName --resource-group $rg --vnet $vnetResourceId --subnet $subnetName --output none 2>$null
              if ($LASTEXITCODE -eq 0) {
                $vnetIntegrationSuccess = $true
                Write-Host "Web App VNet integration successful using resource ID"
              }
            } catch {
              Write-Host "Web App VNet integration with resource ID failed, trying with VNet name"
            }

            # Fallback for Web App
            if (-not $vnetIntegrationSuccess) {
              try {
                az webapp vnet-integration add --name $appName --resource-group $rg --vnet $vnetName --subnet $subnetName --output none
                if ($LASTEXITCODE -eq 0) {
                  $vnetIntegrationSuccess = $true
                  Write-Host "Web App VNet integration successful using VNet name"
                }
              } catch {
                Write-Error "Web App VNet integration failed for $appName with both methods"
              }
            }
          }

          if (-not $vnetIntegrationSuccess) {
            Write-Error "Failed to establish VNet integration for $appName - skipping further network configuration"
            continue
          }

          # Wait for VNet integration to be fully established
          Start-Sleep -Seconds 20

          # Verify VNet integration before proceeding - Use correct command
          if ($appType -eq "FunctionApp") {
            $integrationVerification = az functionapp vnet-integration list --name $appName --resource-group $rg --query "[0].vnetResourceId" -o tsv 2>$null
          } else {
            $integrationVerification = az webapp vnet-integration list --name $appName --resource-group $rg --query "[0].vnetResourceId" -o tsv 2>$null
          }
          
          if (-not $integrationVerification) {
            Write-Error "VNet integration verification failed for $appName"
            continue
          }

          Write-Host "VNet integration verified for $appName"

          # Configure inbound access restrictions - Use correct command
          Write-Host "Configuring inbound access restrictions for $appName"

          # Remove existing access restrictions
          if ($appType -eq "FunctionApp") {
            $allRules = az functionapp config access-restriction show --name $appName --resource-group $rg --query "ipSecurityRestrictions[].name" -o tsv 2>$null
            if ($allRules) {
              foreach ($rule in $allRules) {
                if ($rule -and $rule.Trim() -ne "" -and $rule -ne "Allow_all") {
                  Write-Host "Removing existing Function App access restriction: $rule"
                  az functionapp config access-restriction remove --name $appName --resource-group $rg --rule-name $rule --output none
                }
              }
            }
          } else {
            $allRules = az webapp config access-restriction show --name $appName --resource-group $rg --query "ipSecurityRestrictions[].name" -o tsv 2>$null
            if ($allRules) {
              foreach ($rule in $allRules) {
                if ($rule -and $rule.Trim() -ne "" -and $rule -ne "Allow_all") {
                  Write-Host "Removing existing Web App access restriction: $rule"
                  az webapp config access-restriction remove --name $appName --resource-group $rg --rule-name $rule --output none
                }
              }
            }
          }

          # Set default deny for inbound traffic (main site)
          az resource update --name $appName --resource-group $rg --resource-type "Microsoft.Web/sites" --set "properties.publicNetworkAccess=Enabled" --output none
          az resource update --name $appName --resource-group $rg --resource-type "Microsoft.Web/sites" --set "properties.siteConfig.ipSecurityRestrictionsDefaultAction=Deny" --output none

          # Allow traffic from the integrated subnet - Use correct command
          if ($appType -eq "FunctionApp") {
            az functionapp config access-restriction add --name $appName --resource-group $rg --rule-name "vnetresourceallow" --priority 100 --action Allow --subnet $subnetResourceId --description "Allow traffic from integration subnet $subnetName" --output none
          } else {
            az webapp config access-restriction add --name $appName --resource-group $rg --rule-name "vnetresourceallow" --priority 100 --action Allow --subnet $subnetResourceId --description "Allow traffic from integration subnet $subnetName" --output none
          }

          # SCM site: set default action to Allow, do NOT copy main rules
          az resource update --name $appName --resource-group $rg --resource-type "Microsoft.Web/sites" --set "properties.siteConfig.scmIpSecurityRestrictionsDefaultAction=Allow" --output none

          # Additional Function App networking configuration
          if ($appType -eq "FunctionApp") {
            Write-Host "Applying additional Function App network configuration for $appName"
            
            # Configure Function App runtime settings for VNet
            az functionapp config appsettings set --name $appName --resource-group $rg --settings FUNCTIONS_EXTENSION_VERSION=~4 --output none
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_RUN_FROM_PACKAGE=1 --output none
            
            # Set Function App specific VNet settings
            az functionapp config appsettings set --name $appName --resource-group $rg --settings WEBSITE_ENABLE_SYNC_UPDATE_SITE=true --output none
          }

          # Final verification and diagnostics - Use correct command
          Write-Host "=== Final Verification for $appName ==="
          
          # Verify VNet integration
          Write-Host "VNet Integration Status:"
          if ($appType -eq "FunctionApp") {
            $vnetIntegrationInfo = az functionapp vnet-integration list --name $appName --resource-group $rg --query '[0].{VNet:vnetResourceId,Subnet:subnetResourceId,Status:status}' -o table
            Write-Host $vnetIntegrationInfo
            
            # Verify access restrictions
            Write-Host "Access Restrictions:"
            $accessRestrictions = az functionapp config access-restriction show --name $appName --resource-group $rg --query 'ipSecurityRestrictions[].{Name:name,Priority:priority,Action:action,Subnet:vnetSubnetResourceId}' -o table
            Write-Host $accessRestrictions
            
            # Verify outbound configuration
            Write-Host "Outbound Configuration (App Settings):"
            $outboundSettings = az functionapp config appsettings list --name $appName --resource-group $rg --query "[?contains(name, 'WEBSITE_VNET') || contains(name, 'WEBSITE_CONTENT') || contains(name, 'WEBSITE_DNS')].{Name:name,Value:value}" -o table
            Write-Host $outboundSettings
            
            # Check outbound IP addresses
            Write-Host "Outbound IP Information:"
            $outboundIPs = az functionapp show --name $appName --resource-group $rg --query "{PossibleOutbound:possibleOutboundIpAddresses,Outbound:outboundIpAddresses}" -o table
            Write-Host $outboundIPs
          } else {
            $vnetIntegrationInfo = az webapp vnet-integration list --name $appName --resource-group $rg --query '[0].{VNet:vnetResourceId,Subnet:subnetResourceId,Status:status}' -o table
            Write-Host $vnetIntegrationInfo
            
            # Verify access restrictions
            Write-Host "Access Restrictions:"
            $accessRestrictions = az webapp config access-restriction show --name $appName --resource-group $rg --query 'ipSecurityRestrictions[].{Name:name,Priority:priority,Action:action,Subnet:vnetSubnetResourceId}' -o table
            Write-Host $accessRestrictions
            
            # Verify outbound configuration
            Write-Host "Outbound Configuration (App Settings):"
            $outboundSettings = az webapp config appsettings list --name $appName --resource-group $rg --query "[?contains(name, 'WEBSITE_VNET') || contains(name, 'WEBSITE_CONTENT') || contains(name, 'WEBSITE_DNS')].{Name:name,Value:value}" -o table
            Write-Host $outboundSettings
            
            # Check outbound IP addresses
            Write-Host "Outbound IP Information:"
            $outboundIPs = az webapp show --name $appName --resource-group $rg --query "{PossibleOutbound:possibleOutboundIpAddresses,Outbound:outboundIpAddresses}" -o table
            Write-Host $outboundIPs
          }

          Write-Host "=== Completed configuration for $appName ==="
          Write-Host ""
        }
      }

      # Final infrastructure verification
      Write-Host "=== Final Infrastructure Verification ==="
      Write-Host "Subnet Configuration:"
      $finalSubnetConfig = az network vnet subnet show --resource-group $resourceGroup --vnet-name $vnetName --name $subnetName --query "{Name:name,AddressPrefix:addressPrefix,NSG:networkSecurityGroup.id,NAT:natGateway.id,Delegations:delegations[].serviceName}" -o table
      Write-Host $finalSubnetConfig

      if ($natGatewayExists) {
        Write-Host "NAT Gateway Configuration:"
        $natGatewayConfig = az network nat gateway show --name $natGatewayName --resource-group $resourceGroup --query "{Name:name,PublicIPs:publicIpAddresses[].id,IdleTimeout:idleTimeoutInMinutes}" -o table
        Write-Host $natGatewayConfig
      }

      Write-Host "=== Completed configuring networking for all Function Apps and Web Apps in target RGs ==="
  enabled: true